<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratório de Caixas — Mocidade</title><style>body{margin:0;background:#101115;color:#eee;font:16px system-ui}.wrap{max-width:950px;margin:auto;padding:20px}h1{font-size:clamp(22px,4vw,36px)}.muted{color:#aaa}.panel{background:#1c1e24;border:1px solid #35373b;border-radius:16px;padding:16px}svg{display:block;width:100%;max-height:65vh}button{background:#f6ca4b;border:0;border-radius:8px;padding:12px 18px;font-weight:700}input{accent-color:#f6ca4b}.seq{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:10px 0}.n{background:#292b31;text-align:center;padding:12px 0;border-radius:5px;font-size:13px}.n.on{background:#f6ca4b;color:#161616}.n small{display:block;opacity:.65}.controls{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin:18px 0}.note{color:#c8bfa6;font-size:13px;line-height:1.6}</style><div class="wrap"><div class="muted">CADERNO DE CAIXAS · LEVADA 08 · 2/4</div><h1>Mocidade Independente de Padre Miguel</h1><div class="panel"><svg viewBox="0 0 700 620" aria-label="Caixa em perspectiva superior e baquetas animadas"><defs><radialGradient id="skin"><stop stop-color="#f3f1eb"/><stop offset="1" stop-color="#c4c2bb"/></radialGradient></defs><rect width="700" height="620" fill="#17181c"/><circle cx="350" cy="290" r="249" fill="#65676d"/><circle cx="350" cy="290" r="237" fill="url(#skin)" stroke="#dedfe1" stroke-width="10"/><circle cx="350" cy="290" r="250" fill="none" stroke="#9c9fa5" stroke-width="7"/><text x="350" y="125" text-anchor="middle" fill="#777" font-weight="700">CAIXA</text><g id="sticks"><path id="l" stroke="#dcb97a" stroke-width="13" stroke-linecap="round"/><path id="r" stroke="#dcb97a" stroke-width="13" stroke-linecap="round"/><circle id="lt" r="7" fill="#f6d69a"/><circle id="rt" r="7" fill="#f6d69a"/></g><circle id="flash" cx="350" cy="290" r="20" fill="none" stroke="#f6ca4b" stroke-width="5" opacity="0"/></svg><div class="seq" id="a"></div><div class="seq" id="b"></div><div class="controls"><button id="play">▶ Reproduzir</button><button id="reset">↺</button><label>BPM <output id="v">90</output> <input id="bpm" type="range" min="40" max="180" value="90"></label><label><input type="checkbox" id="sound" checked> Som</label></div><div class="note">TA = direita acentuada · CA = esquerda acentuada · TI = direita fraca · QUI = esquerda fraca.</div></div></div><script>const s=['TA','QUI','TI','CA','TI','QUI','TA','QUI','TI','QUI','TA','QUI','TI','CA','TI','QUI'];const hand=s.map(x=>x==='TA'||x==='TI'?'D':'E'),accent=s.map(x=>x==='TA'||x==='CA');for(let j=0;j<2;j++)document.getElementById(j?'b':'a').innerHTML=s.slice(j*8,j*8+8).map((x,i)=>'<div class="n" id="n'+(i+j*8)+'">'+(accent[i+j*8]?'<b>'+x+'</b>':x)+'<small>'+hand[i+j*8]+'</small></div>').join('');let playing=false,origin=0,elapsed=0,raf,last=-1,ctx;const bpm=document.getElementById('bpm');function snd(strong){if(!sound.checked)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let b=ctx.createBuffer(1,ctx.sampleRate*.05|0,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*(strong?.013:.006)));let n=ctx.createBufferSource(),g=ctx.createGain();n.buffer=b;g.gain.value=strong?.35:.12;n.connect(g);g.connect(ctx.destination);n.start()}catch(e){}}/* POV V7: two independent trajectories, differentiated attack/rebound and lateral drift.
   These are modelled motions, NOT measured 3D tracks from the source footage. */
const impactX={D:389,E:312},impactY={D:274,E:310};
function stick(id,baseX,baseY,tipX,tipY){const p=document.getElementById(id),t=document.getElementById(id+'t');p.setAttribute('x1',baseX);p.setAttribute('y1',baseY);p.setAttribute('x2',tipX);p.setAttribute('y2',tipY);t.setAttribute('cx',tipX);t.setAttribute('cy',tipY)}
function handPose(h,step,f){const active=hand[step]===h;const prev=(step+15)%16,next=(step+1)%16;const previous=hand[prev]===h,following=hand[next]===h;
const strong=active?accent[step]:following?accent[next]:previous?accent[prev]:false;
const lift=strong?110:44;
// Attack starts above the head; impact occurs precisely at the subdivision boundary.
// A quick lift after contact and a slower preparation for the following stroke.
let height;
if(active){height=lift*(Math.sin(Math.PI*Math.min(1,f*1.55))**1.45)*.86}
else if(following){height=lift*(.22+.78*(f*f*(3-2*f)))}
else{height=14+14*Math.sin(Math.PI*f)}
const sway=(active?Math.sin(Math.PI*f)*11:Math.sin(Math.PI*f)*4)*(h==='D'?1:-1);
const px=impactX[h]+sway+(h==='D'?7:-7)*Math.sin(step*.85);
const py=impactY[h]+(active?-8:6)*Math.sin(Math.PI*f)-height*.74;
const gripX=h==='D'?557:145,gripY=h==='D'?566:565;
const wristX=gripX+(h==='D'?-13:13)*Math.sin(Math.PI*f);
const wristY=gripY-height*.12;
return {px,py,wristX,wristY,active,height}}
function draw(){const sec=playing?(performance.now()-origin)/1000+elapsed:elapsed,subdivision=60/(+bpm.value*4),step=Math.floor(sec/subdivision),i=((step%16)+16)%16,f=(sec/subdivision)%1;for(let k=0;k<16;k++)document.getElementById('n'+k).classList.toggle('on',i===k);if(playing&&step!==last){last=step;snd(accent[i])}const L=handPose('E',i,f),R=handPose('D',i,f);stick('l',L.wristX,L.wristY,L.px,L.py);stick('r',R.wristX,R.wristY,R.px,R.py);const hit=f<.14?1-f/.14:0,flash=document.getElementById('flash');flash.setAttribute('cx',hand[i]==='D'?389:312);flash.setAttribute('cy',hand[i]==='D'?274:310);flash.setAttribute('opacity',hit*.9);if(playing)raf=requestAnimationFrame(draw)}
play.onclick=()=>{playing=!playing;if(playing){origin=performance.now();last=-1;draw()}else{elapsed+=(performance.now()-origin)/1000;cancelAnimationFrame(raf)}play.textContent=playing?'❚❚ Pausar':'▶ Reproduzir'};reset.onclick=()=>{elapsed=0;origin=performance.now();last=-1;draw()};bpm.oninput=()=>{if(playing){elapsed+=(performance.now()-origin)/1000;origin=performance.now()}v.textContent=bpm.value};draw();</script></div></html>
