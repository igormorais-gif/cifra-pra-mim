<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sampleador MIMI • Nilo</title><style>body{font-family:system-ui;background:#101625;color:#fff;margin:0;padding:22px;text-align:center}main{max-width:660px;margin:auto}h1{font-size:2.3rem}p{color:#cbd5e1}.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}button{border:0;border-radius:20px;padding:25px 10px;font-size:1.5rem;font-weight:800;background:#fbbf24;color:#172033;touch-action:manipulation}button:active{transform:scale(.97)}.drums button{background:#86efac}.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}.bar button{font-size:1rem;padding:14px}.box{background:#1e293b;border-radius:18px;padding:18px;margin:15px 0}input{max-width:100%}label{display:block;margin:10px}small{color:#cbd5e1}a{color:#93c5fd}</style><main><h1>🎤 SAMPLEADOR MIMI</h1><p>O brinquedo musical do Nilo! IH • ON • MI • MI</p><div class="box"><label>🎙️ Carregar gravação original 147 (D6) <input type="file" id="audio" accept="audio/*"></label><small id="status">Carregue a gravação para ativar a voz original. A bateria já funciona.</small></div><div class="pads" id="voice"><button data-s="0">IH</button><button data-s="1">ON</button><button data-s="2">MI</button><button data-s="3">MI</button></div><div class="bar"><button id="phrase">▶ IH ON MI MI</button><button id="chord">♫ D6</button><button id="stop">■ Parar</button></div><div class="pads drums"><button data-d="kick">🥁 BUMBO</button><button data-d="snare">🥁 CAIXA</button><button data-d="hat">✨ PRATO</button><button id="beat">▶ BATIDA</button></div><div class="box"><label>Andamento <input id="bpm" type="range" min="60" max="150" value="100"><span id="tempo">100 BPM</span></label><label>Início e fim de cada sílaba (segundos):</label><div id="cuts"></div><small>Ajuste os recortes ouvindo a gravação. Eles não modificam o arquivo original.</small></div><p><a href="../laboratorio.html">← Voltar ao Hub</a></p></main><script>let ctx,buffer,beatTimer,active=[];const ac=()=>ctx||(ctx=new(window.AudioContext||window.webkitAudioContext)());const defaults=[[2.8,3.18],[3.18,3.62],[3.62,4.1],[4.1,4.6]];const cuts=document.getElementById('cuts');defaults.forEach((v,i)=>{let l=document.createElement('label');l.textContent=['IH','ON','MI 1','MI 2'][i]+' ';l.innerHTML+=`<input aria-label="Início" type="number" step=".01" min="0" value="${v[0]}" style="width:70px"> – <input aria-label="Fim" type="number" step=".01" min="0" value="${v[1]}" style="width:70px">`;cuts.append(l)});const getcut=i=>[...cuts.children[i].querySelectorAll('input')].map(x=>+x.value);document.getElementById('audio').onchange=async e=>{try{let a=await e.target.files[0].arrayBuffer();buffer=await ac().decodeAudioData(a);document.getElementById('status').textContent='Voz carregada! Duração: '+buffer.duration.toFixed(2)+'s. Ajuste os cortes se necessário.'}catch(err){document.getElementById('status').textContent='Não foi possível abrir esse áudio.'}};function sample(i,when=ac().currentTime){if(!buffer)return;let [start,end]=getcut(i);start=Math.max(0,Math.min(buffer.duration,start));end=Math.max(start,Math.min(buffer.duration,end));if(end<=start)return;let s=ac().createBufferSource(),g=ac().createGain();s.buffer=buffer;s.connect(g).connect(ac().destination);g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(1,when+.008);g.gain.setValueAtTime(1,when+Math.max(.009,end-start-.025));g.gain.linearRampToValueAtTime(0,when+end-start);s.start(when,start,end-start);active.push(s)}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>sample(+b.dataset.s));document.getElementById('phrase').onclick=()=>{let t=ac().currentTime+.02;for(let i=0;i<4;i++){sample(i,t);let [a,b]=getcut(i);t+=Math.max(.12,b-a)+.08}};function osc(freq,t,dur,type='sine',vol=.25){let o=ac().createOscillator(),g=ac().createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac().destination);o.start(t);o.stop(t+dur)}function noise(t,dur,vol,high){let n=ac().createBuffer(1,Math.ceil(ac().sampleRate*dur),ac().sampleRate),a=n.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;let s=ac().createBufferSource(),f=ac().createBiquadFilter(),g=ac().createGain();s.buffer=n;f.type='highpass';f.frequency.value=high;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(ac().destination);s.start(t);s.stop(t+dur)}function drum(type,t=ac().currentTime){if(type==='kick'){let o=ac().createOscillator(),g=ac().createGain();o.frequency.setValueAtTime(135,t);o.frequency.exponentialRampToValueAtTime(48,t+.16);g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(ac().destination);o.start(t);o.stop(t+.22)}else if(type==='snare'){noise(t,.16,.35,900);osc(175,t,.09,'triangle',.14)}else noise(t,.11,.17,6000)}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>drum(b.dataset.d));document.getElementById('chord').onclick=()=>{let t=ac().currentTime;[146.83,293.66,369.99,440].forEach((f,i)=>osc(f,t+i*.035,1.3,'triangle',.12))};let tick=0;document.getElementById('beat').onclick=e=>{if(beatTimer){clearInterval(beatTimer);beatTimer=null;e.target.textContent='▶ BATIDA';return}tick=0;const run=()=>{drum(tick%4===0||tick%4===2?'kick':'snare');drum('hat');tick++};run();beatTimer=setInterval(run,60000/+document.getElementById('bpm').value);e.target.textContent='■ BATIDA'};document.getElementById('bpm').oninput=e=>{document.getElementById('tempo').textContent=e.target.value+' BPM';if(beatTimer){clearInterval(beatTimer);beatTimer=null;document.getElementById('beat').click()}};document.getElementById('stop').onclick=()=>{active.forEach(s=>{try{s.stop()}catch(e){}});active=[];if(beatTimer){clearInterval(beatTimer);beatTimer=null;document.getElementById('beat').textContent='▶ BATIDA'}};</script></html>
