<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Genealogia Intelectual · Particular</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0d10;color:#f0f2f4;font:16px/1.5 system-ui,-apple-system,sans-serif}body{min-height:100dvh}main{max-width:480px;padding:48px 22px;margin:0 auto}h1{font-size:33px;letter-spacing:-.045em;line-height:1.1;margin:12px 0}small,p{color:#a1a9b4}small{letter-spacing:.14em;font-size:10px;text-transform:uppercase}label{display:block;font-size:14px;margin:28px 0 7px}input,button,select{font:inherit;color:inherit;border:1px solid #363c47;border-radius:10px;background:#181c23;padding:13px;width:100%}button{cursor:pointer;margin-top:12px;background:#f0f2f4;color:#101216;font-weight:650}button:disabled{opacity:.55}a{color:#aeb9c7;text-decoration:none;font-size:14px}#status{min-height:24px;color:#edb0a0;font-size:14px}#session{position:fixed;inset:0;display:flex;flex-direction:column;background:#080a0d;padding-top:env(safe-area-inset-top)}#session[hidden],main[hidden]{display:none}#session header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 12px;border-bottom:1px solid #282c34;font-size:13px}#session button{width:auto;margin:0;padding:7px 12px;font-size:13px}iframe{border:0;flex:1;min-height:0;width:100%;background:#0b0d10}
</style></head><body><main id="gate"><a href="../">← Essência do Lúdico</a><p><small>Acervo particular · Vittor Santos</small></p><h1>Genealogia Intelectual</h1><p>Ateliê de harmonização</p><form id="unlock"><label for="study">Laboratório</label><select id="study"><option value="atirei-andares.enc">Atirei o pau no gato — Andares</option><option value="acervo.enc">Ateliê anterior — Repertório</option></select><label for="key">Chave de acesso</label><input id="key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required placeholder="Cole sua chave particular"><button id="submit">Abrir ateliê</button></form><p id="status" role="status" aria-live="polite"></p><p style="font-size:12px">O acervo é criptografado. A chave não é enviada ao servidor nem gravada neste navegador.</p></main><section id="session" hidden><header><a href="../">← Hub</a><span>Acervo particular</span><button id="lock">Bloquear</button></header><iframe id="app" title="Ateliê de harmonização" sandbox="allow-scripts allow-downloads allow-modals" allow="autoplay"></iframe></section>
<script>
const $=id=>document.getElementById(id);const cache=new Map();
function decode(s){return Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(s.length/4)*4,"=")),c=>c.charCodeAt(0))}
$("unlock").addEventListener("submit",async e=>{e.preventDefault();const key=$("key").value.trim();$("status").textContent="Abrindo acervo…";$("submit").disabled=true;try{if(!globalThis.crypto?.subtle||!globalThis.DecompressionStream)throw new Error("Abra esta página no Safari ou Chrome atualizado.");const raw=decode(key);if(raw.length!==32)throw new Error("Chave inválida. Confira a chave completa.");const k=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);const file=$("study").value;if(!["atirei-andares.enc","acervo.enc"].includes(file))throw new Error("Estudo inválido.");if(!cache.has(file)){const r=await fetch("./"+file,{cache:"no-store"});if(!r.ok)throw new Error("Acervo ainda indisponível. Atualize a página.");cache.set(file,decode((await r.text()).replace(/\s/g,"")))}const cached=cache.get(file);let clear;try{clear=await crypto.subtle.decrypt({name:"AES-GCM",iv:cached.slice(0,12),additionalData:new TextEncoder().encode("genealogia-v1")},k,cached.slice(12))}catch(err){throw new Error("Chave incorreta ou acervo indisponível.")}const html=await new Response(new Blob([clear]).stream().pipeThrough(new DecompressionStream("gzip"))).text();if(!html.includes("<html"))throw new Error("Arquivo inválido.");$("app").srcdoc=html;$("key").value="";$("gate").hidden=true;$("session").hidden=false;$("status").textContent=""}catch(err){$("status").textContent=err.message||"Não foi possível abrir."}finally{$("submit").disabled=false}});
$("lock").onclick=()=>{$("app").removeAttribute("srcdoc");$("app").src="about:blank";$("session").hidden=true;$("gate").hidden=false;$("key").value="";$("key").focus()};
</script></body></html>
